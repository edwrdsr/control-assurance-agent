[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-assurance-agent"
version = "0.1.0"
description = "Bounded read-only agent for local control tests and catalog change review"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["assurance_agent*"]
